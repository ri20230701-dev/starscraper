name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job publishes, so only it gets the publishing rights. The build job
# runs npm ci, which executes third-party code, and has no business holding them.
permissions:
  contents: read

# A queued deploy should wait rather than cancel: the last push is what must win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build runs the type check and the whole test suite, so a red suite cannot
      # reach the published site.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
